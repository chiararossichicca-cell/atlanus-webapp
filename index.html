<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlanus App Selection</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #18222d);
      color: var(--tg-theme-text-color, #ffffff);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    .card-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 400px;
    }

    .app-card {
      background-color: var(--tg-theme-secondary-bg-color, #212d3b);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .app-card:active {
      transform: scale(0.98);
      background-color: var(--tg-theme-button-color, #2f6ea5);
    }

    .app-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-icon {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      object-fit: cover;
    }

    .app-title {
      font-weight: bold;
      font-size: 16px;
    }

    .btn-select {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Seleziona l'App Atlanus</h2>

  <div class="card-container">
    <!-- OPZIONE 1: SKY LIGHT -->
    <div class="app-card" onclick="selezionaApp('skylight')">
      <div class="app-info">
        <!-- Inserisci qui l'URL o il percorso dell'immagine di Sky Light -->
        <img src="skylight.jpg" alt="Sky Light" class="app-icon">
        <div class="app-title">Sky Light</div>
      </div>
      <button class="btn-select">Riscatta</button>
    </div>

    <!-- OPZIONE 2: OFFICIAL GROUP -->
    <div class="app-card" onclick="selezionaApp('officialgroup')">
      <div class="app-info">
        <!-- Inserisci qui l'URL o il percorso dell'immagine di Official Group -->
        <img src="officialgroup.jpg" alt="Official Group" class="app-icon">
        <div class="app-title">Official Group</div>
      </div>
      <button class="btn-select">Riscatta</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function selezionaApp(scelta) {
      // Invia la scelta al bot Python sotto forma di stringa JSON
      tg.sendData(JSON.stringify({ azione: "riscatta_atlanus", tipo: scelta }));
    }
  </script>
</body>
</html>
